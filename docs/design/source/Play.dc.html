<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>In-game HUD</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6F0E}a:hover{color:#174F0A}
button{font-family:inherit}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #86CF5E; color: #1F3A12; font-family: 'Nunito', system-ui, sans-serif; overflow: hidden">

  <div style="position: absolute; left: 0; right: 0; top: 0; height: 300px; background: #BFE6FF" aria-hidden="true">
    <div style="position: absolute; right: 36px; top: 150px; width: 70px; height: 70px; border-radius: 50%; background: #FFE066"></div>
    <div style="position: absolute; left: 40px; top: 214px; width: 110px; height: 34px; border-radius: 999px; background: #FFFFFF"></div>
    <div style="position: absolute; left: 70px; top: 196px; width: 54px; height: 40px; border-radius: 50%; background: #FFFFFF"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 30px; background: #6DBA45"></div>
  </div>

  <div style="position: absolute; left: 20px; top: 136px; font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #24557F">LIVE AR CAMERA VIEW</div>

  <div style="position: absolute; left: 16px; right: 16px; top: 250px; height: 396px; border-radius: 56px; background: #B98552; border: 6px solid #8A5E35; box-sizing: border-box; padding: 26px 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 10px">
    <sc-for list="{{holes}}" as="h" hint-placeholder-count="9">
      <div style="position: relative; height: 108px">
        <div style="position: absolute; left: 4px; right: 4px; bottom: 0; height: 32px; border-radius: 50%; background: #3A2614; border: 4px solid #6B4A2B; box-sizing: border-box"></div>
        <sc-if value="{{h.showMole}}" hint-placeholder-val="{{ true }}">
          <button aria-label="{{h.label}}" onClick="{{h.whack}}" style="position: absolute; left: 50%; bottom: 12px; width: 62px; height: 80px; margin-left: -31px; border: 0; padding: 0; background: transparent; cursor: pointer">
            <sc-if value="{{h.isStandard}}" hint-placeholder-val="{{ true }}">
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; border-radius: 31px 31px 10px 10px; background: #8A5A3C"></div>
            </sc-if>
            <sc-if value="{{h.isHelmet}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; border-radius: 31px 31px 10px 10px; background: #8A5A3C"></div>
              <div style="position: absolute; left: -4px; right: -4px; bottom: 50px; height: 26px; border-radius: 30px 30px 4px 4px; background: #FFD23F; border-bottom: 4px solid #C99A00"></div>
            </sc-if>
            <sc-if value="{{h.isGolden}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; border-radius: 31px 31px 10px 10px; background: #FFC83D; box-shadow: 0 0 0 4px #FFF6C2"></div>
            </sc-if>
            <sc-if value="{{h.isBomb}}" hint-placeholder-val="{{ false }}">
              <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 68px; border-radius: 31px 31px 10px 10px; background: #2E2A33; box-shadow: 0 0 0 3px #FF4D4D"></div>
              <div style="position: absolute; left: 29px; bottom: 66px; width: 4px; height: 14px; background: #5E5868"></div>
              <div style="position: absolute; left: 25px; bottom: 76px; width: 12px; height: 12px; border-radius: 50%; background: #FF7A1A"></div>
            </sc-if>
            <div style="position: absolute; left: 16px; bottom: 40px; width: 9px; height: 11px; border-radius: 50%; background: #1F1A14"></div>
            <div style="position: absolute; right: 16px; bottom: 40px; width: 9px; height: 11px; border-radius: 50%; background: #1F1A14"></div>
            <div style="position: absolute; left: 24px; bottom: 28px; width: 14px; height: 9px; border-radius: 50%; background: #FF8FB1"></div>
          </button>
        </sc-if>
        <sc-if value="{{h.bonk}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: 50%; bottom: 26px; width: 76px; height: 54px; margin-left: -38px; border-radius: 20px; background: {{h.bonkBg}}; color: #1F3A12; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 24px; transform: rotate(-8deg); box-shadow: 0 4px 0 #6B4A2B">{{h.bonkText}}</div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 50%; top: 416px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; border: 3px solid #FFFFFF; box-sizing: border-box; pointer-events: none" aria-hidden="true">
    <div style="position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #FF7A1A"></div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <button aria-label="Pause" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #FFFFFF; color: #1F3A12; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 0 #9CC2DC">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </button>
      <div style="display: flex; gap: 6px; flex-grow: 1">
        <div style="flex: 1.3; display: flex; align-items: center; gap: 6px; background: #FF7A1A; color: #1F3A12; border-radius: 14px; padding: 6px 10px; height: 44px; box-sizing: border-box; box-shadow: 0 4px 0 #C4560A">
          <span style="font-size: 12px; font-weight: 900">YOU</span>
          <span style="font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 24px; margin-left: auto">{{score}}</span>
        </div>
        <div style="flex: 1; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 3px solid #2FA8FF; border-radius: 14px; padding: 4px 8px; height: 44px; box-sizing: border-box">
          <span style="font-size: 12px; font-weight: 900">P2</span>
          <span style="font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 20px; margin-left: auto">96</span>
        </div>
        <div style="flex: 1; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 3px solid #F2559A; border-radius: 14px; padding: 4px 8px; height: 44px; box-sizing: border-box">
          <span style="font-size: 12px; font-weight: 900">P3</span>
          <span style="font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 20px; margin-left: auto">74</span>
        </div>
      </div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 999px; padding: 6px 14px 6px 8px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E08A00" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M10 2h4"></path></svg>
        <span style="font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 24px">0:47</span>
      </div>
      <div style="background: #8EDB3F; color: #1F3A12; border-radius: 14px; padding: 4px 14px; font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 26px; transform: rotate(-4deg); box-shadow: 0 4px 0 #5DA324">x{{combo}} COMBO</div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 176px; display: flex; justify-content: center; pointer-events: none">
    <div style="font-family: 'Lilita One', 'Nunito', sans-serif; font-size: 30px; color: #FFD23F; background: #1F3A12; border-radius: 16px; padding: 4px 16px; letter-spacing: 1px">{{shout}}</div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-size: 12px; font-weight: 900; letter-spacing: 1.2px; color: #1F3A12; width: 64px">SWING</span>
      <div style="position: relative; flex-grow: 1; height: 18px; border-radius: 999px; background: #FFFFFF; overflow: hidden">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 58%; border-radius: 999px; background: #FF7A1A"></div>
        <div style="position: absolute; left: 46%; top: 0; bottom: 0; width: 3px; background: #1F3A12"></div>
      </div>
    </div>
    <div style="display: flex; gap: 8px">
      <div style="flex-grow: 1; display: flex; background: #FFFFFF; border-radius: 16px; padding: 4px; height: 52px; box-sizing: border-box">
        <button style="flex: 1; border: 0; border-radius: 12px; background: #1F3A12; color: #FFFFFF; font-weight: 900; font-size: 14px; cursor: pointer">Hammer</button>
        <button style="flex: 1; border: 0; border-radius: 12px; background: transparent; color: #4E6B3A; font-weight: 900; font-size: 14px; cursor: pointer">Tap</button>
      </div>
      <button onClick="{{reset}}" style="height: 52px; padding: 0 16px; border-radius: 16px; border: 0; background: #FFFFFF; color: #1F3A12; font-weight: 800; font-size: 14px; cursor: pointer">Respawn</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const hits = s.hits || {};
    const score = s.score == null ? 128 : s.score;
    const combo = s.combo == null ? 3 : s.combo;
    const layout = [null, 'standard', null, 'golden', 'helmet', 'standard', 'bomb', null, 'standard'];
    const points = { standard: 1, helmet: 2, golden: 5, bomb: -3 };
    const names = { standard: 'Whack the mole', helmet: 'Whack the helmet mole, two hits', golden: 'Whack the golden mole', bomb: 'Bomb mole, do not whack' };
    const holes = layout.map((type, i) => {
      const key = 'h' + i;
      const need = type === 'helmet' ? 2 : 1;
      const n = hits[key] || 0;
      const done = !!type && n >= need;
      const pts = type ? points[type] : 0;
      return {
        key,
        showMole: !!type && !done,
        bonk: done,
        bonkText: pts > 0 ? '+' + pts : String(pts),
        bonkBg: type === 'bomb' ? '#FF6B6B' : (type === 'golden' ? '#FFD23F' : '#8EDB3F'),
        isStandard: type === 'standard',
        isHelmet: type === 'helmet',
        isGolden: type === 'golden',
        isBomb: type === 'bomb',
        label: type ? names[type] : '',
        whack: () => this.whack(key, type, need, pts)
      };
    });
    return {
      holes,
      score,
      combo,
      shout: s.shout || 'TAP A MOLE!',
      reset: () => this.setState({ hits: {}, score: 128, combo: 3, shout: 'TAP A MOLE!' })
    };
  }

  whack(key, type, need, pts) {
    const s = this.state || {};
    const hits = Object.assign({}, s.hits || {});
    const score = s.score == null ? 128 : s.score;
    const combo = s.combo == null ? 3 : s.combo;
    hits[key] = (hits[key] || 0) + 1;
    if (hits[key] < need) {
      this.setState({ hits, shout: 'CLANK! AGAIN!' });
      return;
    }
    if (type === 'bomb') {
      this.setState({ hits, score: score + pts, combo: 0, shout: 'KABOOM! -3' });
      return;
    }
    this.setState({ hits, score: score + pts, combo: combo + 1, shout: type === 'golden' ? 'GOLDEN! +5' : 'SMASH! +' + pts });
  }
}
</script>
</body>
</html>
