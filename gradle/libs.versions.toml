# Created by Lexter Labra
#
# Every version below was checked against its official release page / Maven metadata on 2026-11-07.
# Stable releases only. Where we are deliberately NOT on the newest stable, the reason is noted.

[versions]
# Kotlin 2.4.21 — https://kotlinlang.org/docs/releases.html
kotlin = "2.4.21"
# Compose Multiplatform 1.12.2 — https://github.com/JetBrains/compose-multiplatform/releases/tag/v1.12.2
compose-multiplatform = "1.12.2"
# AGP: newest stable is 9.5.1, but the Kotlin 2.4.20–2.4.21 compatibility table supports AGP 8.5.2–9.3.1
# (https://kotlinlang.org/docs/multiplatform/multiplatform-compatibility-guide.html). 9.3.3 is the latest patch of
# that supported line and fixes a lint crash on JDK 17 (https://developer.android.com/build/releases/agp-9-3-0-release-notes).
agp = "9.3.3"

android-compileSdk = "37"
android-targetSdk = "36"
# Android 10 (API 29) — owner's decision, 2026-11-07.
android-minSdk = "29"
# iOS 15.0 — owner's decision, 2026-11-07 (also Kotlin/Native's and Xcode 27's floor). Mirrored in the Xcode project.
ios-deploymentTarget = "15.0"
jvm-target = "17"

androidx-activity = "1.13.0"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
ktor = "3.6.1"
koin = "4.2.2"
multiplatform-settings = "1.3.0"
turbine = "1.2.1"

# Static analysis / coverage
# detekt: 1.23.8 is the only stable line (2.0 is alpha). It is built for Kotlin 2.0.21, see docs/plan notes.
detekt = "1.23.8"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
kover = "0.9.11"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "compose-multiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }

multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

# Gradle plugins. They are put on the build classpath once, by build-logic, so modules apply them by
# plain id (no version) — see build-logic/build.gradle.kts.
gradlePlugin-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradlePlugin-detekt = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
gradlePlugin-ktlint = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
gradlePlugin-kover = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
gradlePlugin-composeCompiler = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
gradlePlugin-composeMultiplatform = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "compose-multiplatform" }
gradlePlugin-kotlinSerialization = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
